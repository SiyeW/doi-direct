<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DOI Direct</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <div class="preview-locale">
    <label for="previewLocale" data-i18n-title="localePicker">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18"/>
        <path d="M12 3c2.6 2.8 2.6 15.2 0 18"/>
        <path d="M12 3c-2.6 2.8-2.6 15.2 0 18"/>
      </svg>
    </label>
    <select id="previewLocale" data-i18n-title="localePicker"></select>
  </div>

  <h1 data-i18n="optionsTitle">DOI Direct settings</h1>

  <section>
    <h2 data-i18n="secGeneral">General</h2>
    <label class="row">
      <input type="checkbox" id="master">
      <span data-i18n="masterSwitch">Redirect DOI searches</span>
    </label>
    <p class="hint" data-i18n="masterSwitchHint"></p>
  </section>

  <section>
    <h2 data-i18n="secEngines">Search engines</h2>
    <div id="engineList" class="list"></div>
  </section>

  <section>
    <h2 data-i18n="secCustom">Custom search engines</h2>
    <p class="hint" data-i18n="customHint"></p>
    <div id="customList" class="list"></div>
    <div class="grid">
      <label><span data-i18n="fieldName"></span><input type="text" id="ceName" data-i18n-placeholder="fieldNamePlaceholder"></label>
      <label><span data-i18n="fieldHost"></span><input type="text" id="ceHost" data-i18n-placeholder="fieldHostPlaceholder"></label>
      <label><span data-i18n="fieldPath"></span><input type="text" id="cePath" data-i18n-placeholder="fieldPathPlaceholder"></label>
      <label><span data-i18n="fieldParam"></span><input type="text" id="ceParam" data-i18n-placeholder="fieldParamPlaceholder"></label>
    </div>
    <div id="enginePreview" class="preview" hidden></div>
    <button id="addEngine" data-i18n="add">Add</button>
    <p id="customMsg" class="msg"></p>
  </section>

  <section>
    <h2 data-i18n="secResolver">Resolver</h2>
    <p class="hint" data-i18n="resolverHint"></p>
    <div class="grid">
      <label><span data-i18n="resolverBase"></span><input type="text" id="resolverBase" spellcheck="false"></label>
    </div>
    <button id="resetResolver" data-i18n="restoreDefault">Restore default</button>
    <p id="resolverMsg" class="msg"></p>
  </section>

  <section>
    <h2 data-i18n="secAdvanced">Advanced</h2>
    <p class="hint" data-i18n="patternHint"></p>
    <div class="grid">
      <label><span data-i18n="patternLabel"></span><input type="text" id="doiPattern" spellcheck="false"></label>
      <label><span data-i18n="testLabel"></span><input type="text" id="testInput" data-i18n-placeholder="testInputPlaceholder"></label>
    </div>
    <p id="testResult" class="msg"></p>
    <p id="patternMsg" class="msg"></p>
    <button id="resetPattern" data-i18n="restoreDefault">Restore default</button>

    <h3 data-i18n="examplesAccept">Should be redirected</h3>
    <div id="acceptExamples" class="list examples"></div>
    <h3 data-i18n="examplesReject">Should be left alone</h3>
    <div id="rejectExamples" class="list examples"></div>
  </section>

  <footer class="footer">
    <a id="repoLink" target="_blank" rel="noopener" data-i18n="footerSource"></a>
    <span aria-hidden="true">·</span>
    <a id="issuesLink" target="_blank" rel="noopener" data-i18n="footerIssues"></a>
    <span aria-hidden="true">·</span>
    <span>MIT</span>
    <span aria-hidden="true">·</span>
    <span id="version"></span>
  </footer>
</main>

<script src="../core/doi.js"></script>
<script src="../core/engines.js"></script>
<script src="../core/settings.js"></script>
<script src="../i18n.js"></script>
<script src="options.js"></script>
</body>
</html>
